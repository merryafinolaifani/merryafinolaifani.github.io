<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rekording Sapi Perah</title>
<meta name="description" content="Pencatatan sapi perah untuk kelompok peternak: produksi susu, kesehatan, reproduksi, keuangan dan ransum.">
<meta name="theme-color" content="#3c7d47">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app-bar + beranda berisi ubin menu (seperti aplikasi peternakan di HP); tiap menu layar sendiri dengan tombol kembali dan tombol aksi melayang */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --soft:#e7efe9; --ink:#17261d; --muted:#5a6b60; --line:#d7e0da;
  --accent:#2f6b3a; --accent-ink:#ffffff; --bar:#3c7d47; --bar-ink:#ffffff; --hay:#a87818; --hay-soft:#f6ecd5;
  --good:#2b7542; --good-soft:#e1f1e5; --warn:#a9500f; --warn-soft:#fbeadc; --bad:#b3261e; --bad-soft:#fae3e1; --info:#2b5f8a; --info-soft:#e2ecf5;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(20,40,25,.08),0 2px 8px rgba(20,40,25,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1612; --surface:#17211b; --soft:#1e2b23; --ink:#e3ebe5; --muted:#93a59a; --line:#2a3a31;
  --accent:#7cc48a; --accent-ink:#0c1a10; --bar:#1f4027; --bar-ink:#e8f3ea; --hay:#e3b553; --hay-soft:#2e2715;
  --good:#7cc48a; --good-soft:#1b3022; --warn:#f2a066; --warn-soft:#352419; --bad:#f2877e; --bad-soft:#3a1f1c; --info:#8cbde6; --info-soft:#18293a;
  --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1612; --surface:#17211b; --soft:#1e2b23; --ink:#e3ebe5; --muted:#93a59a; --line:#2a3a31;
  --accent:#7cc48a; --accent-ink:#0c1a10; --bar:#1f4027; --bar-ink:#e8f3ea; --hay:#e3b553; --hay-soft:#2e2715;
  --good:#7cc48a; --good-soft:#1b3022; --warn:#f2a066; --warn-soft:#352419; --bad:#f2877e; --bad-soft:#3a1f1c; --info:#8cbde6; --info-soft:#18293a;
  --shadow:none; color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}

/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink)}
.bar-in{max-width:760px;margin:0 auto;min-height:58px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px}
.bar h1{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .grow{flex:1;min-width:0}
.bar .grow > *{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sub{font-size:12.5px;opacity:.85;background:none;border:0;padding:0;text-align:left;color:inherit}
.ib{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:inherit;display:grid;place-items:center;flex:none}
.ib:hover{background:rgba(255,255,255,.14)}
.ib svg{width:24px;height:24px}
.logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none;margin-left:4px}
.sync{font-size:11.5px;white-space:nowrap;opacity:.9}
.sync .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#9fe0ac;margin-right:5px;vertical-align:1px}
.sync.warn .dot{background:#ffc078}

main{max-width:760px;margin:0 auto;padding-block:14px calc(100px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
#view{display:flex;flex-direction:column;gap:14px}
#banner:empty{display:none}
.banner{border-radius:var(--r);padding:10px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.demo{background:var(--hay-soft);border:1px dashed var(--hay)}
.banner.note{background:var(--info-soft)}
.banner .sp{flex:1;min-width:180px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:16px;font-weight:700}
.sec-h .sub{font-size:12.5px;color:var(--muted)}
.muted{color:var(--muted)}
.empty-ok{color:var(--muted);font-size:14px;margin:6px 0}

/* ubin beranda */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 12px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile .ti{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;margin-bottom:6px}
.tile .ti svg{width:26px;height:26px}
.tile h3{font-size:18px;font-weight:600;line-height:1.15}
.tile .ts{font-size:13px;color:var(--muted)}
.tile .tf{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);width:100%;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.t-sapi{background:var(--hay-soft);color:var(--hay)} .t-susu{background:var(--info-soft);color:var(--info)}
.t-sehat{background:var(--bad-soft);color:var(--bad)} .t-repro{background:var(--warn-soft);color:var(--warn)}
.t-out{background:var(--bad-soft);color:var(--bad)} .t-in{background:var(--good-soft);color:var(--good)}
.t-lap{background:var(--soft);color:var(--accent)} .t-pakan{background:var(--good-soft);color:var(--good)}

.alerts{display:flex;flex-direction:column}
.alert{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.alert:first-child{border-top:0}
.alert i{align-self:stretch;border-radius:3px}
.alert.bad i{background:var(--bad)} .alert.warn i{background:var(--warn)} .alert.info i{background:var(--info)}
.alert .t{font-weight:600;font-size:14.5px}
.alert .d{font-size:13px;color:var(--muted)}
.alert .tag{font-family:var(--f-display);font-weight:700;font-size:13px;background:var(--soft);padding:3px 8px;border-radius:6px;white-space:nowrap}

.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:300px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:500;border:1px solid transparent}
.chip b{font-variant-numeric:tabular-nums}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.p-laktasi{background:var(--good-soft);color:var(--good)} .p-kering{background:var(--hay-soft);color:var(--hay)}
.p-dara{background:var(--info-soft);color:var(--info)} .p-pedet,.p-keluar,.p-plain{background:var(--soft);color:var(--muted)}
.p-bunting{background:var(--info-soft);color:var(--info)} .p-ib{background:var(--warn-soft);color:var(--warn)} .p-henti{background:var(--bad-soft);color:var(--bad)}

/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;min-height:42px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.fab{position:fixed;z-index:25;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:15px 22px;font-weight:700;font-size:15px;box-shadow:0 4px 14px rgba(20,50,28,.3);display:inline-flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}
.fab svg{width:20px;height:20px;flex:none}
@media (min-width:792px){.fab{right:calc((100% - 760px)/2 + 12px)}}

/* daftar sapi */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:180px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:600px){.cards{grid-template-columns:1fr}}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.sc-top{display:flex;gap:12px;align-items:center;padding:12px 14px;border:0;background:none;text-align:left;width:100%}
.sc-top .nm{font-weight:700;font-size:16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tagno{flex:none;min-width:58px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:15px;background:var(--hay-soft);color:var(--ink);border:2px solid var(--hay);border-radius:8px 8px 14px 14px;padding:7px 6px 9px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:0;border-top:1px solid var(--line)}
.kv > div{padding:9px 14px;border-bottom:1px solid var(--line);min-width:0}
.kv > div:nth-child(odd){border-right:1px solid var(--line)}
.kv dt{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.acts{display:flex;justify-content:flex-end;gap:4px;padding:6px 8px}
.acts .btn{min-height:36px;padding:6px 12px;font-size:13.5px}

/* tab rekording */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--soft);border-radius:12px;padding:4px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:8px 2px;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.tabs button svg{width:20px;height:20px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}

/* kalender */
.mnav{display:flex;align-items:center;gap:8px}
.mnav b{flex:1;text-align:center;font-family:var(--f-display);font-size:17px;font-weight:700;text-transform:capitalize}
.mnav svg{width:22px;height:22px}
.mnav button{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.cal-h,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-h{margin-top:10px}
.cal-h span{text-align:center;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.cd{height:50px;border-radius:10px;border:1px solid transparent;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;min-width:0}
.cd b{font-size:14px;font-weight:600}
.cd small{font-size:10px;font-weight:600;color:var(--info);font-variant-numeric:tabular-nums;line-height:1;min-height:10px}
.cd.today{border-color:var(--accent)}
.cd.sel{background:var(--accent);color:var(--accent-ink)}
.cd.sel small{color:var(--accent-ink)}
.cd:not(.has) small{visibility:hidden}

.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:420px){.figs{grid-template-columns:repeat(2,1fr)}}
.fig{background:var(--soft);border-radius:10px;padding:9px 11px;min-width:0}
.fig .label{font-size:10.5px}
.fig b{display:block;font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.fig small{display:block;font-size:12px;color:var(--muted)}
.fig.pos b{color:var(--good)} .fig.neg b{color:var(--bad)}

.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:6px}
.tbl td{padding:7px 6px;border-top:1px solid var(--line);vertical-align:middle}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:700}
.tbl td input,.tbl td select{width:100%;padding:9px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.tbl td input{text-align:right;font-variant-numeric:tabular-nums}

.list{display:flex;flex-direction:column;gap:8px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;box-shadow:var(--shadow)}
.rec .dt{font-size:12px;color:var(--muted);text-align:center;min-width:44px;font-variant-numeric:tabular-nums}
.rec .dt b{display:block;font-family:var(--f-display);font-size:19px;color:var(--ink);line-height:1.1}
.rec .tx{min-width:0}
.rec .tx b{font-weight:700}
.rec .tx .d{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.rec .amt{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.rec .amt.out{color:var(--bad)} .rec .amt.in{color:var(--good)}
.rec .ra{grid-column:1/-1;display:flex;justify-content:flex-end;gap:4px;margin:-4px -4px -6px}

.hb{display:flex;flex-direction:column;gap:8px}
.hb-r{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;font-size:13.5px}
.hb-t{grid-column:1/-1;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.hb-t i{display:block;height:100%;background:var(--bad);border-radius:4px}
.hb-r b{font-variant-numeric:tabular-nums}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,20,14,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;padding-block:6px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:88vh}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 10px}
.sh-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sh-h h2{font-size:19px;flex:1;min-width:0}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
form{display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label,.f .lb{font-size:13px;font-weight:600}
.hint{font-size:12px;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px}
.f textarea{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.g2{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.calc{font-size:13px;background:var(--soft);border-radius:10px;padding:9px 12px}
.udder{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--soft);border-radius:var(--r);padding:10px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.type b{font-family:var(--f-display);font-size:15.5px}
.type span{font-size:12.5px;color:var(--muted)}
.type i{width:28px;height:4px;border-radius:2px}
.menu{display:flex;flex-direction:column;gap:10px}

.empty{text-align:center;padding:28px 18px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{font-size:19px}
.empty p{margin:0;color:var(--muted);max-width:44ch}
.empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>

<header class="bar" id="bar"><div class="bar-in"><div class="grow"><h1>Rekording Sapi Perah</h1></div></div></header>
<main><div id="banner"></div><section id="view"><div class="panel empty"><p>Memuat aplikasi…</p></div></section></main>
<button class="fab" id="fab" type="button" hidden></button>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
(() => {
"use strict";
/* ================= utilitas ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => ymd(new Date());
const parse = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const diff = (a, b) => Math.round((parse(a) - parse(b)) / 864e5);
const ymOf = s => String(s).slice(0, 7);
const addMonth = (ym, n) => { const [y, m] = ym.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + "-" + pad(d.getMonth() + 1); };
const monthLabel = ym => parse(ym + "-01").toLocaleDateString("id-ID", {month: "long", year: "numeric"});
const fmtD = s => s ? parse(s).toLocaleDateString("id-ID", {day: "numeric", month: "short", year: "numeric"}) : "–";
const fmtDs = s => s ? parse(s).toLocaleDateString("id-ID", {day: "numeric", month: "short"}) : "–";
const fmtN = (n, dp = 1) => (n == null || isNaN(n)) ? "–" : Number(n).toLocaleString("id-ID", {minimumFractionDigits: dp, maximumFractionDigits: dp});
const fmtRp = n => (n == null || isNaN(n)) ? "–" : (n < 0 ? "−" : "") + "Rp " + Math.round(Math.abs(n)).toLocaleString("id-ID");

/* ================= penulisan (lokal dulu, lalu dikirim) ================= */
function applyLocal(op) {
  switch (op.type) {
    case "sapi.save": S.sapi[op.id] = op.data; break;
    case "sapi.patch": S.sapi[op.id] = {...S.sapi[op.id], ...op.patch}; break;
    case "sapi.del": delete S.sapi[op.id]; break;
    case "catatan.add": S.catatan[op.id] = op.data; break;
    case "catatan.del": delete S.catatan[op.id]; break;
    case "keu.save": S.keu[op.id] = op.data; break;
    case "keu.del": delete S.keu[op.id]; break;
    case "susu.save": { const cur = S.susu[op.tanggal] || {tanggal: op.tanggal, sapi: {}}, m = {...cur.sapi};
      for (const k in op.entries) { const e = op.entries[k]; if (e.pagi == null && e.sore == null) delete m[k]; else m[k] = {pagi: e.pagi, sore: e.sore}; }
      S.susu[op.tanggal] = {tanggal: op.tanggal, sapi: m}; break; }
    case "susu.del": delete S.susu[op.tanggal]; break;
    case "kelompok.set": S.kelompok = op.nama; break;
  }
}
function commit(op) { op.opId = uid(); applyLocal(op); if (!S.demo) { Q.push(op); saveQ(); cacheSave(); flush(); } render(); }
const W = {
  sapi: (id, data) => commit({type: "sapi.save", id: id || uid(), data}),
  sapiPatch: (id, patch) => commit({type: "sapi.patch", id, patch}),
  delSapi: id => commit({type: "sapi.del", id}),
  catatan: data => commit({type: "catatan.add", id: uid(), data}),
  delCatatan: id => commit({type: "catatan.del", id}),
  keu: (id, data) => commit({type: "keu.save", id: id || uid(), data}),
  delKeu: id => commit({type: "keu.del", id}),
  susu: (tanggal, entries) => { const e = {}; for (const k in entries) e[k] = {...entries[k], eartag: (S.sapi[k] || {}).eartag || ""}; commit({type: "susu.save", tanggal, entries: e}); },
  delSusu: tanggal => commit({type: "susu.del", tanggal}),
  kelompok: nama => commit({type: "kelompok.set", nama})

function cacheLoad() { const c = LS.get("rsp_cache", null); if (c) { S.sapi = c.sapi || {}; S.catatan = c.catatan || {}; S.susu = c.susu || {}; S.keu = c.keu || {}; S.kelompok = c.kelompok || ""; S.ready = true; } }
const backendReady = () => MODE === "sheets" ? !!(API && PIN) : !!db;
async function apiGet(url, pin) { const r = await fetch(url + (url.includes("?") ? "&" : "?") + "pin=" + encodeURIComponent(pin) + "&t=" + Date.now(), {redirect: "follow"}); return r.json(); }

const backend = {
  async push(ops) {
    if (MODE === "sheets") { const r = await fetch(API, {method: "POST", redirect: "follow", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify({pin: PIN, ops})}); return r.json(); }
    const hasil = [];
    for (const op of ops) {
      try { await claudeOp(op); hasil.push({id: op.opId, ok: true}); }
      catch (e) { if (e && (e.code === "unavailable" || e.code === "resource_exhausted")) throw e;
        hasil.push({id: op.opId, ok: false, error: e && e.code === "invalid_argument" ? "akun ini hanya bisa melihat data" : (e && e.message) || "gagal"}); }
    }
    return {ok: true, hasil};
  },
  async pull() {
    if (MODE === "sheets") return apiGet(API, PIN);
    const [a, b, c, d, e] = await Promise.all([db.collection("sapi").limit(1000).get(), db.collection("catatan").orderBy("tanggal", "desc").limit(1000).get(),
      db.collection("susu").orderBy("tanggal", "desc").limit(400).get(), db.collection("keuangan").orderBy("tanggal", "desc").limit(1000).get(), db.doc("pengaturan/kelompok").get()]);
    const rows = []; c.docs.forEach(x => { const v = x.data(); for (const sid in (v.sapi || {})) rows.push({tanggal: v.tanggal || x.id, sapiId: sid, pagi: v.sapi[sid].pagi, sore: v.sapi[sid].sore}); });
    return {ok: true, data: {sapi: a.docs.map(x => ({id: x.id, ...x.data()})), catatan: b.docs.map(x => ({id: x.id, ...x.data()})), susu: rows,
      keuangan: d.docs.map(x => ({id: x.id, ...x.data()})), kelompok: e.exists ? (e.data().nama || "") : ""}};
  }
};
async function claudeOp(op) {
  const C = n => db.collection(n);
  switch (op.type) {
    case "sapi.save": return C("sapi").doc(op.id).set(op.data);
    case "sapi.patch": return C("sapi").doc(op.id).update(op.patch);
    case "sapi.del": return C("sapi").doc(op.id).delete();
    case "catatan.add": return C("catatan").doc(op.id).set(op.data);
    case "catatan.del": return C("catatan").doc(op.id).delete();
    case "keu.save": return C("keuangan").doc(op.id).set(op.data);
    case "keu.del": return C("keuangan").doc(op.id).delete();
    case "susu.save": { const ref = C("susu").doc(op.tanggal), snap = await ref.get(), cur = snap.exists ? {...(snap.data().sapi || {})} : {};
      for (const k in op.entries) { const e = op.entries[k]; if (e.pagi == null && e.sore == null) delete cur[k]; else cur[k] = {pagi: e.pagi, sore: e.sore}; }
      if (Object.keys(cur).length) return ref.set({tanggal: op.tanggal, sapi: cur, diubah: Date.now()}); if (snap.exists) return ref.delete(); return; }
    case "susu.del": return C("susu").doc(op.tanggal).delete();

  }
}
function fromServer(d) {
  const sapi = {}, cat = {}, susu = {}, keu = {};
  (d.sapi || []).forEach(x => { const {id, ...r} = x; if (id) sapi[id] = r; });
  (d.catatan || []).forEach(x => { const {id, ...r} = x; if (id) cat[id] = r; });
  (d.keuangan || []).forEach(x => { const {id, ...r} = x; if (id) keu[id] = r; });
  (d.susu || []).forEach(x => { if (!x.tanggal || !x.sapiId) return; (susu[x.tanggal] = susu[x.tanggal] || {tanggal: x.tanggal, sapi: {}}).sapi[x.sapiId] = {pagi: x.pagi, sore: x.sore}; });
  S.sapi = sapi; S.catatan = cat; S.susu = susu; S.keu = keu; S.kelompok = d.kelompok || "";
}
let flushing = false, pulling = false;
async function flush() {

  flushing = true; S.sync = "kirim"; renderSync();
  let rejected = false;
  try {
    const batch = Q.slice(0, 40), r = await backend.push(batch);
    if (r.ok) { Q = Q.slice(batch.length); saveQ(); const bad = (r.hasil || []).filter(h => !h.ok);
      if (bad.length) { rejected = true; toast(bad.length + " catatan tidak tersimpan: " + bad[0].error); }
      S.lastSync = Date.now(); LS.set("rsp_last", S.lastSync); S.sync = "ok"; }
    else if (r.error === "pin") { S.sync = "pin"; flushing = false; renderSync(); askLogin("Kode kelompok sudah diganti. Masukkan kode yang baru; catatan Anda tetap tersimpan di HP."); return; }
    else S.sync = "gagal";
  } catch (e) { S.sync = "offline"; }
  flushing = false; renderSync(); renderBanner();
  if (Q.length && S.sync === "ok") return flush();
  if (rejected) pull();
}
async function pull() {
  if (S.demo || !backendReady() || pulling) return;
  pulling = true;
  try {
    await flush(); if (Q.length) return;
    const r = await backend.pull();
    if (!r.ok) { if (r.error === "pin") askLogin("Kode kelompok sudah diganti. Masukkan kode yang baru."); return; }
    if (Q.length || S.demo) return;
    fromServer(r.data); S.ready = true; S.sync = "ok"; S.lastSync = Date.now(); LS.set("rsp_last", S.lastSync); cacheSave(); render();
  } catch (e) { console.error(e); S.sync = "offline"; if (!S.ready) { S.ready = true; render(); } renderSync(); renderBanner(); }

}

  add({i: 1, jenis: "pakan", tanggal: addDays(t, -10), bcs: 3.25, bobot: 472, hijauan: 40, konsentrat: 7});
  add({i: 7, jenis: "pakan", tanggal: addDays(t, -6), ld: 98});
  Object.values(catatan).forEach(c => delete c.i);
  let nk = 0; const K = (jenis, d, kategori, nama, jumlah, x) => keu[CONTOH + "k" + pad(++nk)] = {jenis, tanggal: addDays(t, -d), kategori, nama, jumlah, catatan: "", liter: null, harga: null, dibuat: nk, ...(x || {})};
  for (let w = 0; w < Math.ceil(days / 7); w++) { const L = 380 + Math.round(rnd() * 40); K("masuk", w * 7 + 1, "Penjualan susu", "Setor susu ke KUD", L * 7000, {liter: L, harga: 7000});
    K("keluar", w * 7 + 2, "Konsentrat & pakan tambahan", "Konsentrat 3 sak", 3 * 165000); K("keluar", w * 7 + 3, "Hijauan", "Rumput gajah 1 pikap", 350000); }
  K("keluar", 12, "Obat & kesehatan", "Antibiotik intramammary", 85000); K("keluar", 21, "IB & reproduksi", "IB CTH-06", 75000); K("keluar", 4, "Tenaga kerja", "Upah perah bulanan", 1200000);
  K("masuk", 18, "Pupuk kandang", "Jual kotoran 20 karung", 200000);
  if (days > 30) { K("keluar", 34, "Tenaga kerja", "Upah perah bulanan", 1200000); K("masuk", 40, "Penjualan pedet", "Pedet jantan", 3500000); }
  return {sapi, catatan, susu, keu};
}
const hasContoh = () => Object.keys(S.sapi).some(isContoh) || Object.keys(S.catatan).some(isContoh) || Object.keys(S.keu).some(isContoh);
function commitMany(ops) { ops.forEach(op => { op.opId = uid(); applyLocal(op); }); if (!S.demo) { Q.push(...ops); saveQ(); cacheSave(); flush(); } render(true); }
function isiContoh() {
  if (hasContoh()) { toast("Data contoh sudah ada."); return; }
  const c = contohData(30), ops = [];
  Object.entries(c.sapi).forEach(([id, data]) => ops.push({type: "sapi.save", id, data}));
  Object.entries(c.catatan).forEach(([id, data]) => ops.push({type: "catatan.add", id, data}));
  Object.entries(c.keu).forEach(([id, data]) => ops.push({type: "keu.save", id, data}));
  Object.values(c.susu).forEach(d => { const e = {}; for (const k in d.sapi) e[k] = {...d.sapi[k], eartag: c.sapi[k].eartag}; ops.push({type: "susu.save", tanggal: d.tanggal, entries: e}); });
  if (!S.kelompok) ops.push({type: "kelompok.set", nama: "Kelompok Contoh"});
  commitMany(ops); closeSheet(); toast("Data contoh ditambahkan: 8 sapi, 30 hari produksi, catatan dan keuangan.");
}
function hapusContoh() {
  const ops = [];
  Object.keys(S.catatan).filter(isContoh).forEach(id => ops.push({type: "catatan.del", id}));
  Object.keys(S.keu).filter(isContoh).forEach(id => ops.push({type: "keu.del", id}));
  Object.values(S.susu).forEach(d => { const e = {}; Object.keys(d.sapi || {}).filter(isContoh).forEach(k => e[k] = {pagi: null, sore: null}); if (Object.keys(e).length) ops.push({type: "susu.save", tanggal: d.tanggal, entries: e}); });
  Object.keys(S.sapi).filter(isContoh).forEach(id => ops.push({type: "sapi.del", id}));
  if (S.kelompok === "Kelompok Contoh") ops.push({type: "kelompok.set", nama: ""});
  commitMany(ops); closeSheet(); toast("Data contoh dihapus.");
}
function startDemo() {
  const c = contohData(60);
  S.demo = true; S.kelompok = "Kelompok Ternak Contoh"; S.ready = true;
  S.sapi = c.sapi; S.catatan = c.catatan; S.susu = c.susu; S.keu = c.keu;
  S.demoNoDb = MODE === "claude" && !db;
  closeSheet(); render(true);
}
function exitDemo() { S.demo = false; S.sapi = {}; S.catatan = {}; S.susu = {}; S.keu = {}; S.kelompok = ""; S.ready = false; cacheLoad(); render(true); if (MODE === "sheets" && !PIN) askLogin(); else pull(); }

/* ================= mulai ================= */
const h0 = location.hash.replace("#", ""); if (ROUTES.includes(h0)) S.route = h0;
cacheLoad();
render(true);
if (MODE === "sheets") { if (!PIN) askLogin(); else pull(); }
else (async () => {
  let tries = 0; while (!(window.claude && window.claude.use) && tries < 30) { await new Promise(r => setTimeout(r, 100)); tries++; }
  if (window.claude && window.claude.use) { try { db = await window.claude.use("db"); } catch (e) { db = null; } try { dl = await window.claude.use("downloads"); } catch (e) { dl = null; } }
  if (!db) { startDemo(); return; }
  S.demoNoDb = false; pull();
})();
setInterval(() => { if (document.visibilityState === "visible") pull(); }, 60000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pull(); });
window.addEventListener("online", () => pull());
window.addEventListener("offline", () => { S.sync = "offline"; renderSync(); renderBanner(); });
if (MODE === "sheets" && "serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
